<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solicitud no aprobada</title>
  </head>
  <body style="margin:0;padding:24px;background-color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellspacing="0" cellpadding="0" style="max-width:480px;background-color:#ffffff;border-radius:8px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 16px;font-size:20px;">{{platformName}}</h1>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">{{greeting}}</p>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">
                  Lamentamos informarte que tu solicitud no fue aprobada. Este es el motivo:
                </p>
                <p style="margin:0 0 16px;padding:12px 16px;background-color:#f3f4f6;border-radius:6px;font-size:14px;line-height:1.5;white-space:pre-line;">{{justification}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
